# Bouwt en test de boekhoudserver (src/Boekhouding.Api) en zet hem op Azure App Service "tcgkiosk".
# De boekhoud-app (WPF, enkel Windows) wordt hier niet gebouwd: die verdeel je als exe (publish.ps1).
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - tcgkiosk

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Eerst de tests: een kapotte versie komt niet online.
      - name: Test
        run: dotnet test tests/Boekhouding.Tests/Boekhouding.Tests.csproj --configuration Release

      # Enkel de server publiceren (niet de WPF-app).
      - name: Publish server
        run: dotnet publish src/Boekhouding.Api/Boekhouding.Api.csproj --configuration Release --output ${{ runner.temp }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v5
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D5A0E1DBF75E4CC5B271F4658265C09F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4BE8039E5A424D70B8AE012B795FE245 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5D4A6FA85B741009F38005F9AAA3F55 }}

      # Veiligheid: niet online zetten zolang de app-instellingen ontbreken. Zonder eigen API-sleutel
      # geldt de voorbeeldsleutel uit de repo (te raden); zonder datamap komt de database in een map
      # die bij elke herstart gewist wordt. Waarden worden niet getoond, enkel of ze ingevuld zijn.
      - name: Check app settings
        run: |
          rg=$(az webapp list --query "[?name=='tcgkiosk'].resourceGroup | [0]" -o tsv)
          names=$(az webapp config appsettings list --name tcgkiosk --resource-group "$rg" --query "[?value!=''].name" -o tsv)
          missing=""
          for s in Security__ApiKey Storage__DataDirectory WEBSITE_TIME_ZONE; do
            echo "$names" | grep -qx "$s" || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Zet eerst deze app-instellingen in Azure (Web app → Instellingen → Omgevingsvariabelen):$missing"
            exit 1
          fi
          echo "App-instellingen in orde."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tcgkiosk'
          slot-name: 'Production'
          package: .
